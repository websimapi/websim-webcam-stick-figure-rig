<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Webcam Stick Figure Rig</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0",
                "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- MediaPipe Dependencies (Loaded via script to ensure WASM/Assets locate correctly) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Hidden video element for processing -->
    <video class="input_video" playsinline style="display: none;"></video>
    
    <!-- UI Overlay -->
    <div id="ui-layer">
        <div id="loading">Initializing Neural Network...</div>
        <div id="controls">
            <button id="toggle-debug">Show Camera</button>
        </div>
        <!-- Small preview for debugging, hidden by default -->
        <canvas class="output_canvas" width="160" height="120"></canvas>
    </div>

    <!-- 3D Container -->
    <div id="canvas-container"></div>

    <script type="module" src="app.js"></script>

</body>
</html>
